<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LIS Slower Sensor</title>
<script src="https://unpkg.com/mqtt@5/dist/mqtt.min.js"></script>
<style>
 body{font-family:-apple-system,"Segoe UI",sans-serif;margin:0;background:#0f172a;color:#e2e8f0}
 header{padding:14px 16px;background:#1e293b;display:flex;justify-content:space-between;align-items:center}
 h1{font-size:18px;margin:0}
 #st{font-size:13px;padding:3px 10px;border-radius:12px;background:#475569}
 #st.ok{background:#16a34a} #st.bad{background:#dc2626}
 .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:12px}
 .card{background:#1e293b;border-radius:12px;padding:12px}
 .card .n{font-size:13px;color:#cbd5e1;font-weight:600} .card .m{font-size:11px;color:#64748b;font-weight:400;margin-left:4px}
 .row{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px} .row .l{font-size:12px;color:#94a3b8}
 .card .v{font-size:26px;font-weight:700}
 .card .u{font-size:14px;color:#94a3b8;margin-left:3px}
 #age{padding:0 16px 8px;color:#94a3b8;font-size:13px}
 #cfg{padding:12px 16px;border-top:1px solid #334155}
 #cfg input{width:100%;box-sizing:border-box;margin:4px 0 8px;padding:8px;border-radius:6px;border:1px solid #475569;background:#0f172a;color:#e2e8f0}
 button{padding:8px 16px;border:0;border-radius:6px;background:#2563eb;color:#fff;font-size:14px}
</style>
</head>
<body>
<header><h1>LIS Slower Sensor</h1><span id="st">연결 안됨</span></header>
<div id="age">-</div>
<div class="grid" id="grid"></div>
<div id="cfg">
 <label>Adafruit IO Username</label><input id="u" autocomplete="off">
 <label>Adafruit IO Key (AIO key)</label><input id="k" type="password" autocomplete="off">
 <button onclick="saveCfg()">저장 후 연결</button>
 <p style="color:#94a3b8;font-size:12px">Feed: <b>lis-slower</b> (LIS_Slower). 값은 이 폰 브라우저에만 저장됩니다.</p>
</div>
<script>
// Sensor types defined in the STM32 firmware (sensor.c): id -> name + value keys
//  RK330-01A (31..34): t=air temperature, h=air humidity
//  RK520-02  (62,63) : t=soil temperature, m=soil moisture
var TYPES={
 31:{n:"대기 온습도 #1",m:"RK330-01A"},32:{n:"대기 온습도 #2",m:"RK330-01A"},
 33:{n:"대기 온습도 #3",m:"RK330-01A"},34:{n:"대기 온습도 #4",m:"RK330-01A"},
 62:{n:"토양 #1",m:"RK520-02"},63:{n:"토양 #2",m:"RK520-02"}};
var KEYS={t:["온도","°C"],h:["습도","%"],m:["토양수분","%"]};
var SOIL={62:1,63:1};
var FEED="lis-slower", sensors={}, lastRx=0, client=null;
var $=function(i){return document.getElementById(i)};
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k)||"";localStorage.setItem(k,v)}catch(e){return ""}}
/* QR/link login: page.html#u=<user>&k=<key>  -> saved in this browser, then removed from the address bar */
if(location.hash.length>1){
  var h=new URLSearchParams(location.hash.slice(1));
  if(h.get("u")&&h.get("k")){ls("aio_user",h.get("u"));ls("aio_key",h.get("k"))}
  history.replaceState(null,"",location.pathname+location.search);
}
$("u").value=ls("aio_user"); $("k").value=ls("aio_key");
function setSt(t,c){var s=$("st");s.textContent=t;s.className=c||""}
function saveCfg(){ls("aio_user",$("u").value.trim());ls("aio_key",$("k").value.trim());connect()}
function connect(){
  var u=ls("aio_user"),k=ls("aio_key"); if(!u||!k){setSt("키 입력 필요","bad");return}
  if(client){try{client.end(true)}catch(e){}}
  setSt("연결 중…");
  client=mqtt.connect("wss://io.adafruit.com:443/mqtt/",{username:u,password:k,clientId:"lisweb"+Math.random().toString(16).slice(2,8),reconnectPeriod:3000});
  var topic=u+"/feeds/"+FEED;
  client.on("connect",function(){setSt("연결됨","ok");client.subscribe(topic);client.publish(topic+"/get","")});
  client.on("close",function(){setSt("재연결 중…","bad")});
  client.on("error",function(){setSt("인증/연결 오류","bad")});
  client.on("message",function(t,m){parse(m.toString())});
}
function parse(s){          // "31:t=23.45,h=50.10;62:t=27.80,m=60.00"
  s.split(";").forEach(function(g){
    var a=g.split(":"); if(a.length!=2)return;
    var id=parseInt(a[0]); if(isNaN(id))return;
    var o={};
    a[1].split(",").forEach(function(p){var kv=p.split("=");if(kv.length==2&&!isNaN(parseFloat(kv[1])))o[kv[0].trim()]=parseFloat(kv[1])});
    if(Object.keys(o).length)sensors[id]=o;
  });
  lastRx=Date.now();
}
function render(){          // runs every 1 s
  var h="",ids=Object.keys(sensors).map(Number).sort(function(a,b){return a-b});
  ids.forEach(function(id){
    var T=TYPES[id]||{n:"센서 "+id,m:""},o=sensors[id];
    h+='<div class="card"><div class="n">'+T.n+(T.m?' <span class="m">'+T.m+'</span>':'')+'</div>';
    ["t","h","m"].forEach(function(k){
      if(o[k]===undefined)return;
      var nm=KEYS[k][0];if(k==="t"&&SOIL[id])nm="지온";
      h+='<div class="row"><span class="l">'+nm+'</span><span class="v">'+o[k].toFixed(1)+'<span class="u">'+KEYS[k][1]+'</span></span></div>';
    });
    h+='</div>';
  });
  $("grid").innerHTML=h||'<div class="card">데이터 대기 중…</div>';
  $("age").textContent=lastRx?("마지막 수신: "+Math.round((Date.now()-lastRx)/1000)+"초 전"):"-";
}
setInterval(render,1000); render(); connect();
</script>
</body>
</html>
